# Nginx configuration for Chess Detector Web App
# Browser-based Stockfish with COOP/COEP headers

server {
    listen 80;
    listen [::]:80;
    server_name 93.127.199.118;  # Change to your domain

    # Root directory (where your built files are)
    root /var/www/chess-web;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml+rss
               application/wasm;
    gzip_disable "msie6";

    # ========================================
    # REQUIRED HEADERS FOR BROWSER STOCKFISH
    # ========================================
    # These enable SharedArrayBuffer for multi-threaded WASM
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ========================================
    # BACKEND API PROXY
    # ========================================
    # Proxy /api requests to your Python backend
    location /api/ {
        # Remove COOP/COEP headers for API requests (not needed)
        add_header Cross-Origin-Opener-Policy "" always;
        add_header Cross-Origin-Embedder-Policy "" always;

        # Proxy to backend
        proxy_pass http://93.127.199.118:8090/;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (important for YOLO inference)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;  # YOLO can take time

        # CORS headers (if needed)
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        # Handle OPTIONS (preflight)
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ========================================
    # STATIC FILES WITH CACHING
    # ========================================

    # Stockfish WASM files (critical - must have CORP header)
    location ~* \.(wasm|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }

    # CSS and JavaScript
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }

    # Images, fonts, etc.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }

    # Opening book JSON (if you have it)
    location /opening_book.json {
        expires 1w;
        add_header Cache-Control "public";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }

    # ========================================
    # REACT ROUTER SPA FALLBACK
    # ========================================
    # All other requests go to index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable logging for health checks (optional)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

